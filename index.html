<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>店铺事务 SOP 管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 引入拖拽排序库（已换国内加速节点） -->
<script src="https://cdn.bootcdn.net/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
  :root {
    --pink-bg: #fdf2f4;
    --pink-soft: #f9e4e8;
    --pink-main: #d99aa6;
    --pink-deep: #b87382;
    --pink-text: #5c4048;
    --pink-muted: #9b7a82;
    --white: #ffffff;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow: 0 8px 28px rgba(185, 115, 130, 0.12);
    --shadow-soft: 0 2px 10px rgba(185, 115, 130, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--pink-bg); color: var(--pink-text); min-height: 100vh; padding: 20px 16px 48px; line-height: 1.6;
  }

  .app { max-width: 1200px; margin: 0 auto; }
  .header { text-align: center; padding: 18px 0 22px; }
  .header h1 { font-size: 1.55rem; font-weight: 600; letter-spacing: 0.5px; color: var(--pink-deep); }
  .header p { margin-top: 6px; font-size: 0.85rem; color: var(--pink-muted); }

  .btn {
    border: none; border-radius: var(--radius-md); padding: 10px 18px; font-size: 0.9rem;
    font-weight: 500; cursor: pointer; transition: background 0.18s, transform 0.12s, box-shadow 0.18s; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--pink-main); color: var(--white); box-shadow: 0 4px 14px rgba(217, 154, 166, 0.35); }
  .btn-primary:hover { background: var(--pink-deep); }
  .btn-ghost { background: var(--white); color: var(--pink-deep); box-shadow: var(--shadow-soft); border: 1px solid var(--pink-soft); }
  .btn-ghost:hover { background: var(--pink-soft); }
  .btn-danger { background: #f6d9dd; color: #9e4f5d; }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: var(--radius-sm); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .layout { display: flex; gap: 20px; align-items: stretch; }
  
  /* 侧边栏样式 */
  .sidebar {
    width: 320px; flex-shrink: 0; background: var(--white); border-radius: var(--radius-lg);
    padding: 16px; box-shadow: var(--shadow-soft); display: flex; flex-direction: column; gap: 12px;
    max-height: calc(100vh - 120px); position: sticky; top: 20px;
  }
  .sidebar-header { display: flex; flex-direction: column; gap: 10px; }
  .sidebar-header .btn { width: 100%; }
  
  .category-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; padding-right: 4px; }
  
  .category-group { display: flex; flex-direction: column; gap: 6px; }
  .category-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.85rem; font-weight: 600; color: var(--pink-deep);
    padding: 4px 6px; cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--pink-soft);
  }
  .category-header span.count { font-size: 0.75rem; font-weight: normal; color: var(--pink-muted); margin-left: auto; margin-right: 8px; }
  .category-header svg { width: 12px; height: 12px; transition: transform 0.2s; fill: var(--pink-main); }
  .category-group.collapsed .category-header svg { transform: rotate(-90deg); }
  .category-group.collapsed .item-list { display: none; }

  .item-list { display: flex; flex-direction: column; gap: 6px; min-height: 10px; padding-bottom: 5px; }
  .item-card {
    background: #fffafb; border: 1.5px solid transparent; border-radius: var(--radius-md);
    padding: 10px 14px; cursor: pointer; transition: all 0.2s; position: relative;
  }
  .item-card:hover { background: var(--pink-soft); }
  .item-card.active { border-color: var(--pink-main); background: var(--pink-soft); }
  .item-name { font-size: 0.9rem; font-weight: 600; color: var(--pink-text); word-break: break-word; pointer-events: none; }
  .item-owner { margin-top: 2px; font-size: 0.75rem; color: var(--pink-muted); pointer-events: none; }
  
  /* 拖拽时的幽灵样式 */
  .sortable-ghost { opacity: 0.4; background: var(--pink-soft); }
  .drag-handle { cursor: grab; color: var(--pink-muted); padding: 0 4px; opacity: 0.3; transition: opacity 0.2s;}
  .item-card:hover .drag-handle { opacity: 1; }

  /* 右侧主内容区 */
  .main-content {
    flex: 1; background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft);
    padding: 24px; display: flex; flex-direction: column; min-height: calc(100vh - 120px);
  }

  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--pink-muted); font-size: 0.95rem; text-align: center;
  }
  .empty-state svg { width: 60px; height: 60px; margin-bottom: 12px; opacity: 0.5; fill: var(--pink-main); }

  .editor-wrapper { display: flex; flex-direction: column; height: 100%; }
  .editor-header {
    display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 16px;
    border-bottom: 1.5px solid var(--pink-soft); margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .editor-title-area h2 { font-size: 1.25rem; color: var(--pink-deep); font-weight: 600; }
  .editor-title-area p { font-size: 0.85rem; color: var(--pink-muted); margin-top: 4px; }
  .editor-header-actions { display: flex; gap: 8px; flex-wrap: wrap;}

  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center;}
  .toolbar-hint { font-size: 0.78rem; color: var(--pink-muted); }
  
  .editor-split { display: flex; gap: 16px; flex: 1; min-height: 500px; }
  .editor-pane { flex: 1; display: flex; flex-direction: column; }
  .preview-pane { flex: 1; display: flex; flex-direction: column; }
  .pane-label { font-size: 0.85rem; font-weight: 600; color: var(--pink-muted); margin-bottom: 8px; display: flex; justify-content: space-between;}
  
  textarea#sopText {
    flex: 1; width: 100%; border: 1.5px solid var(--pink-soft); border-radius: var(--radius-md);
    padding: 14px; font-size: 0.92rem; font-family: inherit; color: var(--pink-text); background: #fffafb;
    outline: none; resize: none; line-height: 1.6; transition: border-color 0.2s, background 0.2s;
  }
  textarea#sopText:focus { border-color: var(--pink-main); background: var(--white); }

  .sop-preview-box {
    flex: 1; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.7; color: var(--pink-text);
    padding: 20px; background: #fffafb; border: 1.5px dashed var(--pink-soft);
    border-radius: var(--radius-md); overflow-y: auto; word-break: break-word; transition: border-color 0.2s, background 0.2s;
  }
  
  .drag-over-active { border-color: var(--pink-main) !important; background: var(--pink-soft) !important; }

  .sop-preview-box img { max-width: 100%; border-radius: 12px; margin: 12px 0; display: block; box-shadow: var(--shadow-soft); cursor: zoom-in;}
  .sop-preview-box .file-attachment { margin: 12px 0; }
  .sop-preview-box .file-attachment a { 
    color: var(--pink-deep); font-weight: 500; text-decoration: none; display: inline-flex; align-items: center;
    padding: 10px 16px; background: var(--pink-soft); border-radius: var(--radius-sm); border: 1px solid var(--pink-main);
    transition: background 0.2s;
  }

  .editor-footer { margin-top: 16px; display: flex; justify-content: flex-end; gap: 10px; align-items: center;}
  .save-hint { font-size: 0.8rem; color: var(--pink-muted); margin-right: auto; padding-left: 4px;}

  #imageLightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 9999; cursor: zoom-out;
  }
  #imageLightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; border-radius: 8px; }

  /* 弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(92, 64, 72, 0.35); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 100;
  }
  .modal-mask.hidden { display: none; }
  .modal {
    background: var(--white); border-radius: var(--radius-lg); width: 100%; max-width: 460px;
    padding: 24px; box-shadow: 0 20px 50px rgba(92, 64, 72, 0.22); animation: popIn 0.2s ease;
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal h3 { font-size: 1.1rem; font-weight: 600; color: var(--pink-deep); margin-bottom: 18px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.84rem; color: var(--pink-muted); margin-bottom: 6px; font-weight: 500; }
  .field input[type="text"], .field select {
    width: 100%; border: 1.5px solid var(--pink-soft); border-radius: var(--radius-md); padding: 12px 14px;
    font-size: 0.92rem; font-family: inherit; color: var(--pink-text); background: #fffafb; outline: none;
  }
  .field input[type="text"]:focus, .field select:focus { border-color: var(--pink-main); background: var(--white); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(12px);
    background: var(--pink-deep); color: var(--white); padding: 10px 20px; border-radius: 999px; font-size: 0.86rem;
    box-shadow: 0 8px 24px rgba(92, 64, 72, 0.25); opacity: 0; pointer-events: none; transition: opacity 0.22s, transform 0.22s; z-index: 200; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .d-none { display: none !important; }

  @media (max-width: 850px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; max-height: 350px; position: static; }
    .main-content { min-height: 600px; padding: 16px; }
    .editor-split.is-editing { flex-direction: column; }
    textarea#sopText { min-height: 250px; }
    .sop-preview-box { min-height: 250px; padding: 12px;}
    .toolbar { gap: 6px;}
    .toolbar .btn { flex: 1; font-size: 0.75rem; padding: 6px 8px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>店铺事务 SOP 管理</h1>
    <p>所有人共用一份清单 · 拖拽左侧卡片即可排序和归类</p>
  </div>

  <div class="layout">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <button class="btn btn-primary" id="btnAdd">+ 新增事务</button>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-ghost btn-sm" style="flex:1" id="btnAddCategory">+ 分类</button>
          <button class="btn btn-ghost btn-sm" style="flex:1" id="btnRefresh">刷新</button>
        </div>
      </div>
      
      <!-- 分类列表容器 -->
      <div class="category-list" id="categoryList">
        <div class="empty-state" style="padding: 20px; font-size:0.8rem;">正在加载…</div>
      </div>
    </aside>

    <!-- 右侧主内容区 -->
    <main class="main-content" id="mainContent">
      <div class="empty-state" id="welcomeState">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        请在左侧选择或新增一个事务，<br>开始编写 SOP
      </div>

      <div class="editor-wrapper" id="editorWrapper" style="display:none;">
        
        <div class="editor-header">
          <div class="editor-title-area">
            <h2 id="curItemName">事务名称</h2>
            <p id="curItemOwner">负责人：-</p>
          </div>
          <div class="editor-header-actions">
            <button class="btn btn-ghost btn-sm" id="btnEditSop">✏️ 编辑SOP</button>
            <button class="btn btn-ghost btn-sm" id="btnEditItem">编辑信息</button>
            <button class="btn btn-danger btn-sm" id="btnDeleteItem">删除</button>
          </div>
        </div>

        <div class="toolbar d-none" id="toolbar">
          <button class="btn btn-ghost btn-sm" id="btnUploadImg" type="button">📷 上传</button>
          <button class="btn btn-ghost btn-sm" id="btnUploadFile" type="button">📎 文件</button>
          <input type="file" id="fileInput" style="display: none;">
          <span class="toolbar-hint">支持直接按 Ctrl+V 粘贴图片</span>
        </div>

        <div class="editor-split" id="editorSplit">
          <div class="editor-pane d-none" id="editorPane">
            <div class="pane-label">
              <span>SOP 内容编辑（支持HTML）</span>
              <span class="toolbar-hint">可拖拽图片到这里</span>
            </div>
            <textarea id="sopText" placeholder="填写该事项的标准操作流程，或在此按 Ctrl+V 粘贴截图…"></textarea>
          </div>
          
          <div class="preview-pane">
            <div class="pane-label" id="previewLabel">SOP 预览</div>
            <div class="sop-preview-box" id="sopPreview"></div>
          </div>
        </div>

        <div class="editor-footer d-none" id="editorFooter">
          <span class="save-hint">快捷键：Ctrl + S 保存</span>
          <button class="btn btn-ghost" id="btnCancelEdit">取消</button>
          <button class="btn btn-primary" id="sopSave">保存 SOP</button>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 新增/编辑事务弹窗 -->
<div class="modal-mask hidden" id="itemModalMask">
  <div class="modal">
    <h3 id="itemModalTitle">新增事务</h3>
    <div class="field">
      <label>所属分类</label>
      <select id="itemCategorySelect"></select>
    </div>
    <div class="field">
      <label>事务名称</label>
      <input type="text" id="itemName" placeholder="例如：每日开店准备" maxlength="120">
    </div>
    <div class="field">
      <label>负责人</label>
      <input type="text" id="itemOwner" placeholder="例如：小王" maxlength="60">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="itemCancel">取消</button>
      <button class="btn btn-primary" id="itemSave">保存</button>
    </div>
  </div>
</div>

<!-- 新增/编辑分类弹窗 -->
<div class="modal-mask hidden" id="catModalMask">
  <div class="modal">
    <h3 id="catModalTitle">新增分类</h3>
    <div class="field">
      <label>分类名称</label>
      <input type="text" id="catName" placeholder="例如：前台事务 / 卫生管理" maxlength="20">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="catCancel">取消</button>
      <button class="btn btn-primary" id="catSave">保存</button>
    </div>
  </div>
</div>

<!-- 图片放大镜 -->
<div id="imageLightbox"><img id="lightboxImg" src=""></div>
<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://lfilxxjysleorholobhj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmaWx4eGp5c2xlb3Job2xvYmhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5Njk3MzksImV4cCI6MjExMDU0NTczOX0.7sTjf2ybZEIm2n6-Q_c5tJ38yJW31p0WXVzmOuKcl5k';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 数据状态
  let categories = [];
  let items = [];
  let currentItemId = null;
  let isEditing = false;
  let editingItemId = null;
  let editingCatId = null;

  // DOM (侧边栏相关)
  const categoryListEl = document.getElementById('categoryList');
  const btnAdd = document.getElementById('btnAdd');
  const btnAddCategory = document.getElementById('btnAddCategory');
  const btnRefresh = document.getElementById('btnRefresh');
  
  // DOM (右侧主编辑器相关)
  const welcomeState = document.getElementById('welcomeState');
  const editorWrapper = document.getElementById('editorWrapper');
  const curItemName = document.getElementById('curItemName');
  const curItemOwner = document.getElementById('curItemOwner');
  const btnEditSop = document.getElementById('btnEditSop');
  const btnEditItem = document.getElementById('btnEditItem');
  const btnDeleteItem = document.getElementById('btnDeleteItem');
  const toolbar = document.getElementById('toolbar');
  const editorSplit = document.getElementById('editorSplit');
  const editorPane = document.getElementById('editorPane');
  const previewLabel = document.getElementById('previewLabel');
  const editorFooter = document.getElementById('editorFooter');
  const sopText = document.getElementById('sopText');
  const sopPreview = document.getElementById('sopPreview');
  const sopSave = document.getElementById('sopSave');
  const btnCancelEdit = document.getElementById('btnCancelEdit');
  const btnUploadImg = document.getElementById('btnUploadImg');
  const btnUploadFile = document.getElementById('btnUploadFile');
  const fileInput = document.getElementById('fileInput');
  const imageLightbox = document.getElementById('imageLightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  // DOM (事务弹窗)
  const itemModalMask = document.getElementById('itemModalMask');
  const itemModalTitle = document.getElementById('itemModalTitle');
  const itemCategorySelect = document.getElementById('itemCategorySelect');
  const itemNameInput = document.getElementById('itemName');
  const itemOwnerInput = document.getElementById('itemOwner');
  const itemCancel = document.getElementById('itemCancel');
  const itemSave = document.getElementById('itemSave');

  // DOM (分类弹窗)
  const catModalMask = document.getElementById('catModalMask');
  const catModalTitle = document.getElementById('catModalTitle');
  const catNameInput = document.getElementById('catName');
  const catCancel = document.getElementById('catCancel');
  const catSave = document.getElementById('catSave');

  const toastEl = document.getElementById('toast');

  let toastTimer = null;
  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  // ====== 数据加载 ======
  async function loadData(isSilent = false) {
    if (!isSilent) categoryListEl.innerHTML = '<div style="padding:20px;text-align:center;font-size:0.8rem;color:var(--pink-muted);">正在加载…</div>';
    
    const [catRes, itemRes] = await Promise.all([
      supabaseClient.from('shop_categories').select('*').order('sort_order', { ascending: true }),
      supabaseClient.from('shop_items').select('*').order('sort_order', { ascending: true })
    ]);

    if (catRes.error) return showToast('分类加载失败：' + catRes.error.message);
    if (itemRes.error) return showToast('事项加载失败：' + itemRes.error.message);

    categories = catRes.data || [];
    items = itemRes.data || [];
    
    renderSidebar();

    if (currentItemId !== null) {
      const exist = items.find(x => x.id === currentItemId);
      if (!exist) {
        closeEditor();
      } else if (!isEditing && isSilent) {
        sopText.value = exist.sop || '';
        updatePreview();
        curItemName.textContent = exist.name;
        curItemOwner.textContent = `负责人：${exist.owner || '未指定'}`;
      }
    }
  }

  // 加上这个 escapeHtml 函数 (就是之前漏掉的)
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ====== 渲染侧边栏 ======
  function renderSidebar() {
    if (categories.length === 0) {
      categoryListEl.innerHTML = '<div class="empty-state" style="padding:20px;font-size:0.85rem;">暂无分类</div>';
      return;
    }

    let html = '';
    categories.forEach(cat => {
      const catItems = items.filter(i => (i.category || '未分类内容') === cat.name);
      
      html += `
        <div class="category-group" data-cat-id="${cat.id}" data-cat-name="${cat.name}">
          <div class="category-header">
            <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
            <span class="cat-name" title="双击可重命名" style="cursor: text;">${cat.name}</span>
            <span class="count">${catItems.length}</span>
          </div>
          <div class="item-list" data-cat-name="${cat.name}">
            ${catItems.map(item => `
              <div class="item-card ${item.id === currentItemId ? 'active' : ''}" data-id="${item.id}">
                <div class="item-name">${escapeHtml(item.name)}</div>
                <div class="item-owner">负责人：<span>${escapeHtml(item.owner || '未指定')}</span></div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    });

    categoryListEl.innerHTML = html;
    initSortable();
  }

  // ====== 初始化拖拽 (Sortable.js) ======
  function initSortable() {
    document.querySelectorAll('.item-list').forEach(list => {
      new Sortable(list, {
        group: 'shared',
        animation: 150,
        ghostClass: 'sortable-ghost',
        onEnd: async function (evt) {
          const newCatName = evt.to.dataset.catName;
          if (evt.from !== evt.to) updateCategoryCounts();
          await saveSortOrderAndCategory(newCatName, evt.to);
        }
      });
    });

    new Sortable(categoryListEl, {
      animation: 150,
      handle: '.category-header',
      ghostClass: 'sortable-ghost',
      onEnd: async function () {
        const catEls = categoryListEl.querySelectorAll('.category-group');
        const updates = [];
        catEls.forEach((el, index) => {
          const id = el.dataset.catId;
          updates.push({ id: Number(id), sort_order: index });
        });
        for (let u of updates) {
          await supabaseClient.from('shop_categories').update({ sort_order: u.sort_order }).eq('id', u.id);
        }
        showToast('分类排序已保存');
      }
    });
  }

  function updateCategoryCounts() {
    document.querySelectorAll('.category-group').forEach(group => {
      const count = group.querySelectorAll('.item-card').length;
      group.querySelector('.count').textContent = count;
    });
  }

  async function saveSortOrderAndCategory(catName, listEl) {
    const itemEls = listEl.querySelectorAll('.item-card');
    const updates = [];
    
    itemEls.forEach((el, index) => {
      const id = Number(el.dataset.id);
      const item = items.find(x => x.id === id);
      if (item) {
        item.category = catName;
        item.sort_order = index;
      }
      updates.push({ id, category: catName, sort_order: index });
    });

    for (let u of updates) {
      await supabaseClient.from('shop_items').update({ 
        category: u.category, 
        sort_order: u.sort_order 
      }).eq('id', u.id);
    }
  }

  // ====== 侧边栏交互逻辑 ======
  categoryListEl.addEventListener('click', (e) => {
    const header = e.target.closest('.category-header');
    if (header && !e.target.classList.contains('cat-name')) {
      header.parentElement.classList.toggle('collapsed');
      return;
    }

    const card = e.target.closest('.item-card');
    if (card) {
      const id = Number(card.dataset.id);
      if (id !== currentItemId && isEditing) {
        if (!confirm('当前有未保存的修改，确定切换吗？')) return;
      }
      openEditor(id);
    }
  });

  categoryListEl.addEventListener('dblclick', async (e) => {
    if (e.target.classList.contains('cat-name')) {
      const group = e.target.closest('.category-group');
      const oldName = group.dataset.catName;
      const newName = prompt('修改分类名称：', oldName);
      
      if (newName && newName.trim() !== '' && newName !== oldName) {
        const name = newName.trim();
        const { error: catErr } = await supabaseClient.from('shop_categories')
          .update({ name: name }).eq('name', oldName);
        
        if (catErr) return showToast('重命名失败：名称可能已存在');
        
        await supabaseClient.from('shop_items').update({ category: name }).eq('category', oldName);
        showToast('分类已重命名');
        loadData();
      }
    }
  });

  // ====== 弹窗逻辑 (分类) ======
  btnAddCategory.addEventListener('click', () => {
    editingCatId = null;
    catModalTitle.textContent = '新增分类';
    catNameInput.value = '';
    catModalMask.classList.remove('hidden');
  });

  catCancel.addEventListener('click', () => catModalMask.classList.add('hidden'));
  
  catSave.addEventListener('click', async () => {
    const name = catNameInput.value.trim();
    if (!name) return showToast('请填写分类名称');
    
    catSave.disabled = true;
    const maxSort = categories.length > 0 ? Math.max(...categories.map(c => c.sort_order)) : 0;
    
    const { error } = await supabaseClient.from('shop_categories').insert({ name: name, sort_order: maxSort + 1 });
    catSave.disabled = false;
    
    if (error) return showToast('新增失败：' + error.message);
    catModalMask.classList.add('hidden');
    showToast('分类已新增');
    loadData();
  });

  // ====== 弹窗逻辑 (事项) ======
  function populateCategorySelect(selectedName) {
    itemCategorySelect.innerHTML = categories.map(c => 
      `<option value="${c.name}" ${c.name === selectedName ? 'selected' : ''}>${c.name}</option>`
    ).join('');
  }

  btnAdd.addEventListener('click', () => {
    editingItemId = null;
    itemModalTitle.textContent = '新增事务';
    itemNameInput.value = '';
    itemOwnerInput.value = '';
    populateCategorySelect(categories[0]?.name);
    itemModalMask.classList.remove('hidden');
  });

  btnEditItem.addEventListener('click', () => {
    const item = items.find(x => x.id === currentItemId);
    if (!item) return;
    editingItemId = item.id;
    itemModalTitle.textContent = '编辑事务信息';
    itemNameInput.value = item.name;
    itemOwnerInput.value = item.owner || '';
    populateCategorySelect(item.category || '未分类内容');
    itemModalMask.classList.remove('hidden');
  });

  itemCancel.addEventListener('click', () => itemModalMask.classList.add('hidden'));

  itemSave.addEventListener('click', async () => {
    const name = itemNameInput.value.trim();
    const owner = itemOwnerInput.value.trim();
    const category = itemCategorySelect.value;
    
    if (!name) return showToast('请填写名称');

    itemSave.disabled = true;
    itemSave.textContent = '保存中…';
    let error;
    
    if (editingItemId != null) {
      ({ error } = await supabaseClient.from('shop_items').update({ name, owner, category }).eq('id', editingItemId));
    } else {
      const maxSort = items.filter(i => i.category === category).length;
      ({ error } = await supabaseClient.from('shop_items').insert({ name, owner, category, sort_order: maxSort, sop: '' }));
    }
    itemSave.disabled = false;
    itemSave.textContent = '保存';

    if (error) return showToast('保存失败：' + error.message);
    itemModalMask.classList.add('hidden');
    showToast(editingItemId != null ? '已更新' : '已新增');
    
    await loadData(isEditing);
    if (editingItemId != null) openEditor(editingItemId); 
  });

  // ====== 右侧主编辑器逻辑 ======
  function openEditor(id) {
    const item = items.find(x => x.id === id);
    if (!item) return;

    currentItemId = id;
    exitEditMode();
    
    document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
    const activeCard = document.querySelector(`.item-card[data-id="${id}"]`);
    if(activeCard) activeCard.classList.add('active');

    welcomeState.style.display = 'none';
    editorWrapper.style.display = 'flex';
    
    curItemName.textContent = item.name;
    curItemOwner.textContent = `负责人：${item.owner || '未指定'}`;
    
    sopText.value = item.sop || '';
    updatePreview();
  }

  function closeEditor() {
    currentItemId = null;
    exitEditMode();
    editorWrapper.style.display = 'none';
    welcomeState.style.display = 'flex';
  }

  function updatePreview() { sopPreview.innerHTML = sopText.value; }
  sopText.addEventListener('input', updatePreview);

  function enterEditMode() {
    isEditing = true;
    btnEditSop.classList.add('d-none');
    btnEditItem.classList.add('d-none');
    btnDeleteItem.classList.add('d-none');
    
    toolbar.classList.remove('d-none');
    editorPane.classList.remove('d-none');
    editorFooter.classList.remove('d-none');
    editorSplit.classList.add('is-editing');
    
    previewLabel.innerHTML = '实时预览（所见即所得） <span class="toolbar-hint">可直接拖拽到此区域</span>';
    sopText.focus();
  }

  function exitEditMode() {
    isEditing = false;
    btnEditSop.classList.remove('d-none');
    btnEditItem.classList.remove('d-none');
    btnDeleteItem.classList.remove('d-none');
    
    toolbar.classList.add('d-none');
    editorPane.classList.add('d-none');
    editorFooter.classList.add('d-none');
    editorSplit.classList.remove('is-editing');
    
    previewLabel.textContent = 'SOP 预览';
  }

  btnEditSop.addEventListener('click', enterEditMode);
  
  btnCancelEdit.addEventListener('click', () => {
    const item = items.find(x => x.id === currentItemId);
    if (item) {
      sopText.value = item.sop || '';
      updatePreview();
    }
    exitEditMode();
  });

  // 文件上传逻辑
  async function handleFileUpload(file) {
    const isImage = file.type.startsWith('image/');
    showToast(isImage ? '正在上传图片…' : '正在上传文件…');
    
    let fileExt = 'png';
    if (file.name && file.name.includes('.')) fileExt = file.name.split('.').pop();
    
    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
    const { error } = await supabaseClient.storage.from('sop_files').upload(fileName, file);
    if (error) return showToast('上传失败：' + error.message);

    const { data } = supabaseClient.storage.from('sop_files').getPublicUrl(fileName);
    let insertHtml = isImage 
      ? `\n<img src="${data.publicUrl}" alt="图片">\n` 
      : `\n<div class="file-attachment"><a href="${data.publicUrl}" target="_blank">📥 下载文件：${file.name || '文件'}</a></div>\n`;

    const startPos = sopText.selectionStart;
    sopText.value = sopText.value.substring(0, startPos) + insertHtml + sopText.value.substring(sopText.selectionEnd);
    sopText.focus();
    sopText.selectionStart = sopText.selectionEnd = startPos + insertHtml.length;
    updatePreview();
    showToast('上传成功！已插入');
  }

  btnUploadImg.addEventListener('click', () => { fileInput.accept = 'image/*'; fileInput.click(); });
  btnUploadFile.addEventListener('click', () => { fileInput.accept = ''; fileInput.click(); });
  fileInput.addEventListener('change', async (e) => {
    if (e.target.files.length) { await handleFileUpload(e.target.files[0]); fileInput.value = ''; }
  });

  sopText.addEventListener('paste', async (e) => {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        e.preventDefault();
        const file = items[i].getAsFile();
        if (file) await handleFileUpload(file);
        break;
      }
    }
  });

  const dropZones = [editorPane, sopPreview];
  dropZones.forEach(zone => {
    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!isEditing) return;
      zone.classList.add('drag-over-active');
      if (zone === editorPane) sopText.classList.add('drag-over-active');
    });
    zone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over-active');
      if (zone === editorPane) sopText.classList.remove('drag-over-active');
    });
    zone.addEventListener('drop', async (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over-active');
      if (zone === editorPane) sopText.classList.remove('drag-over-active');
      if (!isEditing) return showToast('请先进入编辑模式');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        for (let i = 0; i < files.length; i++) await handleFileUpload(files[i]);
      }
    });
  });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      if (isEditing) { e.preventDefault(); sopSave.click(); }
    }
  });

  sopPreview.addEventListener('click', (e) => {
    if (e.target.tagName === 'IMG') { lightboxImg.src = e.target.src; imageLightbox.style.display = 'flex'; }
  });
  imageLightbox.addEventListener('click', () => { imageLightbox.style.display = 'none'; lightboxImg.src = ''; });

  sopSave.addEventListener('click', async () => {
    if (currentItemId == null) return;
    sopSave.disabled = true;
    sopSave.textContent = '保存中…';
    const { error } = await supabaseClient.from('shop_items').update({ sop: sopText.value }).eq('id', currentItemId);
    sopSave.disabled = false;
    sopSave.textContent = '保存 SOP';
    if (error) return showToast('保存失败：' + error.message);
    showToast('SOP 已保存');
    exitEditMode();
    await loadData(true); 
  });

  btnDeleteItem.addEventListener('click', async () => {
    const item = items.find(x => x.id === currentItemId);
    if (!item || !confirm(`确定删除“${item.name}”吗？`)) return;
    const { error } = await supabaseClient.from('shop_items').delete().eq('id', currentItemId);
    if (error) return showToast('删除失败：' + error.message);
    showToast('事务已删除');
    closeEditor();
    await loadData();
  });

  btnRefresh.addEventListener('click', () => loadData(true));

  // 启动应用
  loadData();
</script>
</body>
</html>
